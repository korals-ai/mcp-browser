# Run this MCP server locally and expose it on localhost:8096.
#
#   cp .env.example .env     # choose find's model provider (or none)
#   docker compose up
#
# Then point your agent at http://localhost:8096/mcp — and open
# http://localhost:8096 in a tab to watch the browser the agent is driving.
services:
  browser:
    # The published image. This directory is a mirror of the tool's source, and
    # its Dockerfile builds from the monorepo it is mirrored from (it copies
    # shared packages that sit beside it there), so it cannot build on its own.
    image: ghcr.io/korals-ai/mcp-browser:latest
    # The only architecture published. Docker on an ARM machine (Apple silicon)
    # runs it under emulation: it works, more slowly.
    platform: linux/amd64
    ports:
      - "8096:8096"
    volumes:
      # The tools operate on paths, so whatever is mounted here is what the
      # agent can read and write — and what a page that manipulates the agent
      # could get attached to a form. Defaults to ./work, NOT this directory
      # (its .env holds find's API key); override with
      # WORKDIR=/path/to/project docker compose up
      - "${WORKDIR:-./work}:/work"
    # Run as you, so files the tools create are owned by you on the host rather
    # than by the image's unprivileged uid. Override on a non-1000 host with
    # MCP_UID=$(id -u) MCP_GID=$(id -g) docker compose up  (UID is readonly in bash)
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"
    environment:
      # The image's own HOME is not writable under a different uid; /tmp is.
      HOME: /tmp
      # Anchors the data root at /work (the server derives it as this path's
      # grandparent): the file tools reach /work, downloads and saved
      # screenshots land there, and the browser profile persists under it.
      BROWSER_PROFILE_DIR: /work/.cobrowse/profile
      # `find`'s model tier, chosen in .env. Required: an EMPTY url is the
      # explicit "literal matching only" choice, and an unset one stops compose
      # here instead of silently picking for you.
      BROWSER_FIND_INFERENCE_URL: ${BROWSER_FIND_INFERENCE_URL?copy .env.example to .env and choose find's model provider (README, Quickstart)}
      BROWSER_FIND_INFERENCE_KEY: ${BROWSER_FIND_INFERENCE_KEY?copy .env.example to .env and choose find's model provider (README, Quickstart)}
      BROWSER_FIND_MODEL: ${BROWSER_FIND_MODEL?copy .env.example to .env and choose find's model provider (README, Quickstart)}
    # Chromium needs more shared memory than Docker's 64 MB default or it will
    # crash on content-heavy pages.
    shm_size: 1gb
